<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>进化算法实验室 · Interactive Labs</title><link rel="stylesheet" href="../shared.css"><link rel="stylesheet" href="style.css"></head><body><main class="lab-container" id="evolution"><header class="lab-top"><div><a class="back" href="../">← 所有实验</a><h1>进化实验室</h1><p>Genetic Evolution Lab · 自然选择 · 基因交叉 · 随机变异</p></div><span id="status">模拟运行中</span></header><div class="stats"><article>当前世代<strong id="generation">1</strong></article><article>本代抵达<strong id="success">0</strong></article><article>历史最佳适应度<strong id="best">0.00</strong></article><article>总体成功率<strong id="rate">0%</strong></article></div><section class="panel"><div class="bar"><span><i class="dot" style="background:#46a5ec"></i>个体　<i class="dot" style="background:#e5b357"></i>精英　<i class="dot" style="background:#41c99b"></i>目标</span><span id="stepLabel">生命周期 0 / 180</span></div><canvas id="world" width="780" height="400"></canvas><div class="bar"><span>点击地图可以移动目标</span><span>圆形个体绕开障碍</span></div></section><div class="actions"><button id="play" class="primary">Ⅱ 暂停演化</button><button id="next">单步运行</button><button id="reset">重新进化</button><button id="obstacles">切换障碍</button></div><section class="panel pad"><b>实验参数</b><div class="controls"><label>种群数量 <output id="popValue">70</output><input id="pop" type="range" min="20" max="180" step="10" value="70"><small>下一代生效</small></label><label>基因变异率 <output id="mutationValue">3%</output><input id="mutation" type="range" min="0" max="30" value="3"><small>每个基因独立变异概率</small></label><label>演化速度 <output id="speedValue">4×</output><input id="speed" type="range" min="1" max="20" value="4"><small>每帧模拟步数</small></label></div></section><section class="panel pad"><div class="bar"><b>进化曲线</b><span>每代最佳 / 平均适应度</span></div><canvas id="chart" width="720" height="150"></canvas><p class="muted center"><span style="color:#e5b357">━━</span> 最佳适应度　<span style="color:#46a5ec">━━</span> 平均适应度</p></section><section class="panel pad"><b>正在发生什么？</b><p class="muted" id="explain">第一代行动基因完全随机，每个个体拥有 180 个方向指令。</p><div class="rules"><article>① 选择<small>高分个体繁殖</small></article><article>② 交叉<small>组合亲代基因</small></article><article>③ 变异<small>探索新路径</small></article></div></section></main><script src="app.js"></script></body></html>
