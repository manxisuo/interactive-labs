<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>康威生命游戏 · Interactive Labs</title><link rel="stylesheet" href="../shared.css"><link rel="stylesheet" href="style.css"></head><body><main class="lab-container" id="life"><header class="lab-top"><div><a class="back" href="../">← 所有实验</a><h1>康威生命游戏</h1><p>Conway's Game of Life · B3/S23 · 没有中央控制的演化</p></div><span id="status">运行中</span></header><div class="stats"><article>演化世代<strong id="generation">0</strong></article><article>存活细胞<strong id="alive">0</strong></article><article>种群密度<strong id="density">0%</strong></article></div><section class="panel"><div class="bar"><b>生命网格</b><span>60 × 36</span></div><canvas id="board" width="840" height="504"></canvas><div class="bar"><span id="tool">当前工具：画笔</span><span>点击或拖动网格</span></div></section><div class="actions"><button id="play" class="primary">Ⅱ 暂停</button><button id="step">单步 →</button><button id="clear">清空</button><button id="random">随机生成</button><button id="demo">经典演示</button><button id="undo">撤销一步</button></div><section class="panel pad"><div class="bar"><b>演化速度</b><output id="speedText">8 代/秒</output></div><input type="range" id="speed" min="1" max="30" value="8"></section><section class="panel pad"><b>生命图案库</b><p class="muted">选择图案后点击网格放置</p><div class="patterns"><button data-pattern="draw" class="active">✎ 自由绘制</button><button data-pattern="glider">↗ 滑翔机</button><button data-pattern="blinker">↔ 闪烁器</button><button data-pattern="toad">▦ 蟾蜍</button><button data-pattern="pulsar">✳ 脉冲星</button><button data-pattern="gun">⚙ 滑翔机炮</button></div><p class="muted" id="desc">画笔模式：按住并拖动可绘制活细胞。点击已有活细胞可以将其清除。</p></section><section class="panel pad"><b>生命的四条规则 · B3/S23</b><div class="rules"><article><b>1. 孤独死亡</b><p>少于 2 个活邻居的活细胞死亡</p></article><article><b>2. 维持生存</b><p>活细胞拥有 2 或 3 个活邻居则存活</p></article><article><b>3. 拥挤死亡</b><p>超过 3 个活邻居的活细胞死亡</p></article><article><b>4. 繁殖诞生</b><p>死细胞恰好有 3 个活邻居则诞生</p></article></div></section></main><script src="app.js"></script></body></html>
