<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>微型生态圈 · Interactive Labs</title><link rel="stylesheet" href="../shared.css"><link rel="stylesheet" href="style.css"></head><body><main id="ecosystem" class="lab-container"><header class="lab-top"><div><a class="back" href="../">← 所有实验</a><h1>微型生态圈</h1><p>Living Ecosystem · 植物 · 食草动物 · 捕食者 · 涌现</p></div><span id="status">● 演化中</span></header><div class="stats"><article>植物<strong id="plants" style="color:#48b874">0</strong><small id="plantSub">资源覆盖率</small></article><article>食草动物<strong id="herbs" style="color:#e6b75c">0</strong><small id="herbSub">寻找食物</small></article><article>捕食者<strong id="preds" style="color:#df7475">0</strong><small id="predSub">追踪猎物</small></article><article>模拟天数<strong id="days">0</strong><small>生态时间</small></article></div><section class="panel"><div class="bar"><b>生态栖息地</b><span>64 × 38 个生态单元</span></div><div class="world"><canvas id="world" width="896" height="532"></canvas><span id="overlay">选择物种后在地图上投放</span></div><div class="bar"><span>绿色：植物　黄色：兔子　红色：狐狸</span><span>点击 / 拖动编辑世界</span></div></section><div class="actions"><button id="play" class="primary">Ⅱ 暂停演化</button><button id="step">单步</button><button id="reset">重置</button></div><section class="panel pad"><b>生态干预工具</b><div class="brushes"><button data-brush="plant" class="active">● 种植物</button><button data-brush="herb">● 放兔子</button><button data-brush="pred">● 放狐狸</button><button data-brush="erase">橡皮擦</button></div><label class="small">画笔范围 <output id="brushValue">2</output><input id="brushSize" type="range" min="1" max="5" value="2"></label></section><section class="panel pad"><div class="bar"><b>种群数量演化</b><span id="chartSpan">最近 0 天</span></div><div class="bar"><span>🟢 植物　🟡 食草动物　🔴 捕食者</span><select id="chartMode"><option value="relative">各物种独立刻度</option><option value="absolute">统一数量刻度</option></select></div><canvas id="chart" width="860" height="246"></canvas><p id="chartTip" class="muted"></p></section><section class="panel pad"><div class="bar"><b>环境与进化参数</b><button id="defaults">恢复默认参数</button></div><div class="controls"><label>植物每日生长概率 <output id="growthV">8%</output><input id="growth" type="range" min="0" max="30" value="8"><small>周围有植物时更容易扩散</small></label><label>食草动物繁殖阈值 <output id="energyV">17</output><input id="energy" type="range" min="9" max="35" value="17"><small>能量充足时产生后代</small></label><label>捕食成功概率 <output id="huntV">80%</output><input id="hunt" type="range" min="0" max="100" value="80"><small>遭遇兔子时的捕获机会</small></label><label>捕食者繁殖阈值 <output id="predEnergyV">26</output><input id="predEnergy" type="range" min="14" max="50" value="26"><small>捕食获得能量后繁殖</small></label><label>代谢消耗倍数 <output id="costV">1.0×</output><input id="cost" type="range" min="5" max="25" value="10"><small>动物每日的能量消耗</small></label><label>模拟速度 <output id="speedV">8 天/秒</output><input id="speed" type="range" min="1" max="40" value="8"><small>只改变播放速度</small></label></div></section><section class="panel pad"><b>实验场景</b><div class="scenes"><button class="active" data-scene="balance"><b>平衡生态</b><small>适量植物、兔子和狐狸</small></button><button data-scene="boom"><b>资源爆发</b><small>丰富植物与较少捕食者</small></button><button data-scene="crisis"><b>捕食危机</b><small>大量狐狸与稀缺食物</small></button></div><div class="actions"><button id="addGrass">+ 200 植物</button><button id="addHerbs">+ 30 兔子</button><button id="addPreds">+ 10 狐狸</button></div></section><section class="panel pad"><b>生态观察日志</b><div id="log" class="log"></div></section><p class="muted">简化离散空间多智能体教学模型，未按真实生态数据标定。物种可能灭绝，灭绝后不会自动重新出现。</p></main><script src="app.js"></script></body></html>
